[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panda-mujoco-manipulation"
version = "0.1.0"
description = "Panda manipulation and grasping experiments based on MuJoCo."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mujoco>=3.12,<4.0",
    "matplotlib>=3.8,<4.0",
    "numpy>=2.2,<3.0",
    "scipy>=1.15,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

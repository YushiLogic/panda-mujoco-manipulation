name: Panda MuJoCo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run automated tests
        run: python -m pytest -v

      - name: Run 100 seeded random-action smoke episodes
        run: >-
          python examples/day25/random_smoke.py
          --episodes 100
          --max-steps 100
          --seed-start 0
          --csv "${{ runner.temp }}/random_smoke.csv"
